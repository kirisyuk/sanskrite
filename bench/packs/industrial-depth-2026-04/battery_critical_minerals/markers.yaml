vertical: battery_critical_minerals
description: |
  Knowledge depth markers for the battery / critical minerals probe.
  Tier 1 = generally expected of any large LLM with industrial coverage.
  Tier 2 = competent supply-chain knowledge, reaches second-tier suppliers.
  Tier 3 = expert / recent-event awareness, reaches third-tier or 2024-2026 specifics.
  Markers are matched as case-insensitive substrings unless `regex: true`.

