steps:
  - name: 'node:22-alpine'
    entrypoint: 'sh'
    args: ['-lc', 'npm ci --no-audit || npm install --no-audit']
    dir: '.'
  - name: 'node:22-alpine'
    entrypoint: 'sh'
    args: ['-lc', 'npm run build:ci']
    dir: '.'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args: ['-lc', 'gsutil -m rsync -r -c -d dist $_BUCKET']
    dir: '.'
timeout: '120s'
options:
  logging: LEGACY
  machineType: 'E2_HIGHCPU_8'
  # Disk caching to speed-up subsequent builds
  diskSizeGb: 50
substitutions:
  _BUCKET: ""
artifacts:
  objects:
    location: '$_BUCKET'
    paths: ['dist/**']

