[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthorde-common"
version = "0.1.0"
description = "Shared canonicalizer and schemas for AgentHorde (Vertex ADK and Azure runtimes)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "google-cloud-firestore",
  "rapidfuzz",
  "unidecode",
  "httpx",
  "google-genai",
  "openai>=1.69.0",
]

[tool.setuptools.packages.find]
where = ["."]
