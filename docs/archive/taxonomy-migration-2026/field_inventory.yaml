    used_by_fe: [graph, inspector]
    used_by_backend: [repo, propagation, all]
    disposition: keep_typed
    attribute_name: id
  - field: TenantID
    used_by_fe: [lens]
    used_by_backend: [repo, policy]
    disposition: keep_typed
    attribute_name: tenant_id
  - field: SourceFragmentID
    used_by_fe: [graph]
    used_by_backend: [repo, propagation, all]
    disposition: keep_typed
    attribute_name: source_fragment_id
  - field: TargetFragmentID
    used_by_fe: [graph]
    used_by_backend: [repo, propagation, all]
    disposition: keep_typed
    attribute_name: target_fragment_id
  - field: Type
    used_by_fe: [graph, inspector, filters]
    used_by_backend: [repo, propagation, policy, all]
    disposition: keep_typed
    attribute_name: relation
    note: "DependencyType -> generated RelationType (snake_case)."
  - field: Properties.Criticality
    used_by_fe: [graph, inspector]
    used_by_backend: [propagation, exposure]
    disposition: keep_typed
    attribute_name: criticality
    note: "Exposed as metrics.criticality on the AH model; keep typed for performance."
  - field: Properties.Amplification
    used_by_fe: [graph]
    used_by_backend: [propagation]
    disposition: keep_typed
    attribute_name: amplification
  - field: Properties.LatencyHours
    used_by_fe: [inspector]
    used_by_backend: [propagation]
    disposition: keep_typed
    attribute_name: latency_hours
  - field: Qualifiers
    used_by_fe: [inspector]
    used_by_backend: [policy, propagation, scout]
    disposition: keep_typed
    attribute_name: qualifiers
    note: "Heterogeneous map. Migrate-cli moves named qualifiers into attributes.* per below."
  - field: Provenance
    used_by_fe: [inspector]
    used_by_backend: [repo, scout, audit]
    disposition: keep_typed
    attribute_name: provenance
  - field: ValidFrom
    used_by_fe: [inspector]
    used_by_backend: [propagation]
    disposition: keep_typed
    attribute_name: valid_from
  - field: ValidTo
    used_by_fe: [inspector]
    used_by_backend: [propagation]
    disposition: keep_typed
    attribute_name: valid_to
  - field: Metadata
    used_by_fe: [inspector]
    used_by_backend: [repo, watch]
    disposition: keep_typed
    attribute_name: metadata
  - field: Metrics
    used_by_fe: [inspector, graph]
    used_by_backend: [propagation, metrics]
    disposition: keep_typed
    attribute_name: metrics

# Named edge qualifiers — current keys and their disposition.
# Anything not listed here that appears in the wild is dropped by migrate-cli.
edge_qualifiers:
  - key: facet
    disposition: drop_after_migration
    note: "DependencyFacet (infrastructure/payment/legitimization/...) is removed entirely. Criminal/illicit dimension will return as a future attribute on supplies."
  - key: substitutability
    disposition: lift_to_attributes
    attribute_name: substitutability
  - key: throughput_share
    disposition: lift_to_attributes
    attribute_name: throughput_share
  - key: reroute_penalty
    disposition: lift_to_attributes
    attribute_name: reroute_penalty
  - key: reroute_latency_delta_hours
    disposition: lift_to_attributes
    attribute_name: reroute_latency_delta_hours
  - key: reroute_cost_delta_pct
    disposition: lift_to_attributes
    attribute_name: reroute_cost_delta_pct
  - key: capacity_constraint
    disposition: lift_to_attributes
    attribute_name: capacity_constraint
  - key: integration_type
    disposition: lift_to_attributes
    attribute_name: integration_type
  - key: at_facility
    disposition: drop_after_migration
    note: "Replaced by siteTransforms[] on the /site fragment (no longer a per-edge qualifier)."
  - key: transport_via
    disposition: lift_to_attributes
    attribute_name: route_fragment_id
    note: "Migrate-cli expands array form into one supplies-leg attribute per leg."
  - key: route_mode
    disposition: lift_to_attributes
    attribute_name: mode
  - key: geo_refs
    disposition: lift_to_attributes
    attribute_name: geo_refs
  - key: flow_refs
    disposition: lift_to_attributes
    attribute_name: flow_refs
  - key: alternate_flow_refs
    disposition: lift_to_attributes
    attribute_name: alternate_flow_refs
  - key: zone_refs
    disposition: lift_to_attributes
    attribute_name: zone_refs
  - key: affected_zone_refs
    disposition: lift_to_attributes
    attribute_name: affected_zone_refs
  - key: spatial_semantics
    disposition: lift_to_attributes
    attribute_name: spatial_semantics
  - key: binding_confidence
    disposition: lift_to_attributes
    attribute_name: binding_confidence
  - key: path_stress_score
    disposition: lift_to_attributes
    attribute_name: path_stress_score
  - key: path_fragility
    disposition: lift_to_attributes
    attribute_name: path_fragility
  - key: path_rerouteability
    disposition: lift_to_attributes
    attribute_name: path_rerouteability
  - key: path_zone_pressure
    disposition: lift_to_attributes
    attribute_name: path_zone_pressure
  - key: path_affected_pressure
    disposition: lift_to_attributes
    attribute_name: path_affected_pressure
  - key: recovery_latency_hours
    disposition: lift_to_attributes
    attribute_name: recovery_latency_hours
  - key: assurance_type
    disposition: lift_to_attributes
    attribute_name: assurance_type
    note: "Becomes the required closed-enum attribute on `assures` edges."
  - key: edgeModality
    disposition: lift_to_attributes
    attribute_name: edge_modality

# -----------------------------------------------------------------------------
# RouteGeometryProfile (backend/internal/horizon/models/route_geometry_profile.go)
# -----------------------------------------------------------------------------
# Geometry currently lives in a side collection; migration lifts it onto
# /route fragments under attributes.geometry. The legacy collection itself
# is retained read-only until pathquery fully replaces materialized reads
# (followup), then dropped.
route_geometry_profile:
  - field: ID
    disposition: keep_typed
    attribute_name: id
  - field: TenantID
    disposition: keep_typed
    attribute_name: tenant_id
  - field: ProfileKey
    disposition: keep_typed
    attribute_name: profile_key
  - field: RouteVariantKey
    disposition: keep_typed
    attribute_name: route_variant_key
  - field: OrderedRefs
    disposition: keep_typed
    attribute_name: ordered_refs
  - field: FlowRefs
    disposition: keep_typed
    attribute_name: flow_refs
  - field: Coordinates
    used_by_fe: [map]
    used_by_backend: [supply-chain-overlay, propagation]
    disposition: lift_to_attributes
    attribute_name: geometry
    note: "Lifted to /route fragment attributes.geometry by migrate-cli."
  - field: EncodedPolyline
    used_by_fe: [map]
    used_by_backend: []
    disposition: lift_to_attributes
    attribute_name: encoded_polyline
  - field: Source
    disposition: keep_typed
    attribute_name: source
  - field: Accuracy
    disposition: keep_typed
    attribute_name: accuracy
  - field: Notes
    disposition: keep_typed
    attribute_name: notes
  - field: CreatedAt
    disposition: keep_typed
    attribute_name: created_at
  - field: UpdatedAt
    disposition: keep_typed
    attribute_name: updated_at

# -----------------------------------------------------------------------------
# MaterializedArtifact (backend/internal/horizon/models/materialized_artifact.go)
# -----------------------------------------------------------------------------
# Materialized artifacts are NOT first-class graph fragments — they are derived
# overlays. The migration rewrites payloads in place (siteTransform descriptors,
# /route geometry refs) but keeps the document shape stable. Disposition here
# applies to what migrate-cli keeps vs strips inside payloads.
materialized_artifact:
  - field: ID
    disposition: keep_typed
    attribute_name: id
  - field: TenantID
    disposition: keep_typed
    attribute_name: tenant_id
  - field: ProjectID
    disposition: keep_typed
    attribute_name: project_id
  - field: LensID
    disposition: keep_typed
    attribute_name: lens_id
  - field: Kind
    disposition: keep_typed
    attribute_name: kind
    note: "MaterializedKind enum is preserved as-is for now. Deprecation tracked separately."
  - field: CanonicalKey
    disposition: keep_typed
    attribute_name: canonical_key
  - field: MetricObservationIDs
    disposition: keep_typed
    attribute_name: metric_observation_ids
  - field: EvidenceFactIDs
    disposition: keep_typed
    attribute_name: evidence_fact_ids
  - field: Payload
    disposition: keep_typed
    attribute_name: payload
    note: "Migrate-cli rewrites payload contents in place; field stays."
  - field: Status
    disposition: keep_typed
    attribute_name: status
  - field: PathStatus
